# Heroku container stack manifest.
#
# With this file present and the app on the `container` stack, `git push heroku main`
# builds the Dockerfile on Heroku's builder (no local Docker needed) and then runs
# the release phase before swapping dynos.
#
# Note: runtime config vars (DATABASE_URL, SECRET_KEY_BASE, PHX_HOST, ...) are NOT
# available at build time, only during the release phase and at runtime. This app
# reads all of them in config/runtime.exs, so nothing needs to be passed to the build.
build:
  docker:
    web: Dockerfile

release:
  image: web
  command:
    - /app/bin/migrate

run:
  web: /app/bin/server
